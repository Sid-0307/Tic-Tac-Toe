services:
  - type: web
    name: tictactoe-nakama
    runtime: docker
    dockerfilePath: ./nakama/Dockerfile
    dockerContext: ./nakama
    healthCheckPath: /healthcheck
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tictactoe-db
          property: connectionString
      - key: NAKAMA_RUNTIME_JS_ENTRYPOINT
        value: data/modules/tictactoe.js

  - type: web
    name: tictactoe-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_NAKAMA_HOST
        sync: false
      - key: VITE_NAKAMA_PORT
        value: "443"
      - key: VITE_NAKAMA_USE_SSL
        value: "true"

databases:
  - name: tictactoe-db
    databaseName: nakama
    user: nakama
